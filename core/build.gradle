plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = false
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

//    compileOnly fg.deobf(battleroyale_curse_maven)
    compileOnly fg.deobf(files("${rootProject.projectDir}/libs/battleroyale-0.5.5-dev1-forge-1.20.1.jar"))
}

jar {
    archiveBaseName.set(mod_id)
    archiveVersion.set(mod_version)
    archiveClassifier.set("core")
}